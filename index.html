<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Nightstand Clock</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Clock">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/000000/FFFFFF/?text=Clock">
    
    <!-- Premium UI Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Professional Minimalist Icons (Phosphor) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-primary: rgba(255, 255, 255, 0.92); 
            --text-secondary: rgba(255, 255, 255, 0.5); 
            --text-tertiary: rgba(255, 255, 255, 0.3); 
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden; user-select: none;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        
        /* Dimming Overlay for Evening Hours */
        body.is-dimmed {
            --text-primary: rgba(255, 255, 255, 0.6); 
            --text-secondary: rgba(255, 255, 255, 0.35); 
            --text-tertiary: rgba(255, 255, 255, 0.2); 
        }

        /* Full screen container */
        #app-container {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* Drifting container for Burn-in Protection & Sleep Fade */
        #shift-container {
            width: 94vw; height: 94vh;
            display: flex; flex-direction: column;
            transition: transform 4s ease-in-out, opacity 1.5s ease-in-out; 
            box-sizing: border-box;
            opacity: 1; 
        }
        
        /* Date Display */
        #date-display {
            font-size:6.2vh; font-weight: 400; color: var(--text-tertiary);
            text-align: center; letter-spacing: 0.1vw; text-transform: uppercase;
            padding-bottom: 1vh;
        }

        /* ===============================
           TOP: CLOCK 
           =============================== */
        #clock-section {
            display: flex; justify-content: center; align-items: center; 
            width: 100%; flex: 1; 
        }
        #time {
            font-size: 55vh; font-weight: 300; line-height: 0.75;
            letter-spacing: -0.9vw; font-variant-numeric: tabular-nums;
            margin: 0; text-shadow: 0 2vh 4vh rgba(0,0,0,0.5);
        }

        /* ===============================
           BOTTOM: WEATHER DASHBOARD
           =============================== */
        #weather-section {
            display: flex; justify-content: space-between; align-items: flex-end;
            width: 100%; padding-bottom: 2vh; gap: 5vw; 
        }

        /* --- Left: Current Weather --- */
        #current-weather {
            display: flex; align-items: center; gap: 2vw; flex: 0 0 auto; 
        }
        #current-icon {
            width: 14vh; height: 14vh; object-fit: contain; flex-shrink: 0;
        }
        #current-temp-container {
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
        }
        .temp-actual {
            font-size: 18vh; font-weight: 300; line-height: 0.8; letter-spacing: -0.9vw;
        }
        .temp-feels {
            font-size: 14vh; font-weight: 300; color: var(--text-secondary);
            line-height: 0.85; margin-top: 1vh; letter-spacing: -0.1vw;
        }

        /* --- Right: Forecast --- */
        #forecast {
            display: flex; flex: 1; justify-content: space-between; 
            align-items: flex-end; padding-bottom: 1.5vh; 
        }
        .forecast-item {
            display: flex; flex-direction: column; align-items: center; gap: 1.2vh;
        }
        .forecast-time {
            font-size: 4.5vh; color: var(--text-tertiary); font-weight: 400; letter-spacing: 0.1vw;
        }
        .forecast-icon {
            width: 10.5vh; height: 10.5vh; object-fit: contain; flex-shrink: 0;
        }
        .forecast-temp {
            font-size: 10vh; font-weight: 400; color: var(--text-primary);
        }

        /* Invisible video for iOS 15 screen wake */
        #ios-wakelock { display: none; }

        /* Battery Warning Icon (Android Only) */
        #battery-warning {
            position: fixed; top: 3vh; right: 3vw;
            font-size: 4vh; color: #ff3b30;
            display: none; /* Hidden by default */
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="shift-container">
            <div id="date-display">--</div>
            
            <div id="clock-section">
                <div id="time">00:00</div>
            </div>

            <div id="weather-section">
                <div id="current-weather">
                    <img id="current-icon" src="" alt="Weather Icon">
                    <div id="current-temp-container">
                        <span class="temp-actual" id="actual-temp">--°C</span>
                        <span class="temp-feels" id="feels-temp">/ --°C</span>
                    </div>
                </div>
                <div id="forecast"><!-- Injected via JS --></div>
            </div>
        </div>
    </div>
    
    <!-- Fixed position container for overlays like battery warning -->
    <i id="battery-warning" class="ph ph-battery-warning-vertical"></i>

    <!-- Blank tiny video to prevent iOS 15 from sleeping -->
    <video id="ios-wakelock" playsinline muted loop autoplay>

    <script>
        // Service worker removed: on old iOS Safari its all-or-nothing cache made updates
        // fail and the phone kept serving a stale page. Proactively unregister any worker
        // previously installed on a device, and clear its caches, so pages always load fresh.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
            if (window.caches) caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
        }
        
        // --- GLOBAL STATE & CONFIG ---
        const LAT = 50.10, LON = 8.54; // rounded to ~1 km so a public URL doesn't pinpoint home
        let wakeLock = null;
        let isManualSleep = false;
        let peekTimeout = null;
        let lastWeatherSuccess = 0; // timestamp of the last successful weather fetch (0 = never)

        // --- CORE FUNCTIONS ---
        function updateClockAndState() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 1. Update Clock UI
            document.getElementById('time').innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            
            // 2. Nightly Memory Reload
            if (hours === 3 && minutes === 0 && seconds === 0) {
                window.location.reload();
            }

            // 3. Determine Sleep & Dim State
            const isAutoSleepTime = (hours === 22 && minutes >= 5) || hours > 22 || hours < 6;
            const isDimTime = hours >= 20 && !isAutoSleepTime;
            
            const shouldBeAsleep = isManualSleep || isAutoSleepTime;

            // 4. Apply UI State
            const shiftContainer = document.getElementById('shift-container');
            if (shouldBeAsleep) {
                if (shiftContainer.style.opacity !== '0') shiftContainer.style.opacity = '0';
            } else {
                if (shiftContainer.style.opacity !== '1') shiftContainer.style.opacity = '1';
            }
            document.body.classList.toggle('is-dimmed', isDimTime && !shouldBeAsleep);
        }

        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', options);
        }

        function moveScreen() {
            const container = document.getElementById('shift-container');
            container.style.transform = `translate(${Math.floor(Math.random()*15)-7}px, ${Math.floor(Math.random()*15)-7}px)`;
        }

        // --- EVENT LISTENERS ---
        function setupInteractions() {
            // Manual Sleep Override (Double Tap)
            document.body.addEventListener('dblclick', () => {
                isManualSleep = !isManualSleep;
                updateClockAndState(); // Apply change immediately
            });
            
            // Tap to Peek
            document.body.addEventListener('click', () => {
                const isAutoSleepTime = new Date().getHours() >= 22 || new Date().getHours() < 6;
                const currentlyAsleep = isManualSleep || isAutoSleepTime;

                if (currentlyAsleep) {
                    clearTimeout(peekTimeout);
                    const shiftContainer = document.getElementById('shift-container');
                    shiftContainer.style.opacity = '1';
                    peekTimeout = setTimeout(() => {
                        shiftContainer.style.opacity = '0';
                    }, 5000); // Show for 5 seconds
                }
            });
        }
        
        // --- BATTERY LOGIC (ANDROID/CHROME ONLY) ---
        function checkBatteryStatus(battery) {
            const warningIcon = document.getElementById('battery-warning');
            if (!battery.charging && battery.level < 0.2) {
                warningIcon.style.display = 'block';
            } else {
                warningIcon.style.display = 'none';
            }
        }
        
        function setupBatteryMonitor() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    checkBatteryStatus(battery);
                    battery.addEventListener('chargingchange', () => checkBatteryStatus(battery));
                    battery.addEventListener('levelchange', () => checkBatteryStatus(battery));
                });
            }
        }

            'thunderstorms-rain': '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="m18 36a14 14 0 0 1 12.32-13.9a15 15 0 0 1 29.62 4.9a10 10 0 0 1 0 19h-41.8a14 14 0 0 1 -14.12-14.8a13.88 13.88 0 0 1 13.98-13.2" fill="#7c8e9b"/><path d="m18 36h41.8a10 10 0 0 0 .1-20a15 15 0 0 0 -29.6-4.9a14 14 0 0 0 -12.4 13.9" fill="#94a3b3"/><path d="m26.5 44-7 8h11l-7 8" fill="none" stroke="#fcc44d" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/><g fill="none" stroke="#75b1d8" stroke-linecap="round" stroke-miterlimit="10" stroke-width="3"><path d="m40 50v6m8-6v6"/></g></svg>',
            'not-available': '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="12" fill="none" stroke="#c6d4e1" stroke-miterlimit="10" stroke-width="3"/><path d="m24.42 24.42 15.16 15.16" fill="none" stroke="#c6d4e1" stroke-linecap="round" stroke-miterlimit="10" stroke-width="3"/></svg>'
        };

        const weatherIconMap = {
            0: { day: 'clear-day', night: 'clear-night' }, 1: { day: 'partly-cloudy-day', night: 'partly-cloudy-night' },
            2: { day: 'partly-cloudy-day', night: 'partly-cloudy-night' }, 3: 'overcast', 45: 'fog', 48: 'fog',
            51: 'drizzle', 53: 'drizzle', 55: 'drizzle', 56: 'sleet', 57: 'sleet', 61: 'rain', 63: 'rain', 65: 'rain',
            66: 'sleet', 67: 'sleet', 71: 'snow', 73: 'snow', 75: 'snow', 77: 'snow',
            80: { day: 'partly-cloudy-day-rain', night: 'partly-cloudy-night-rain' }, 81: { day: 'partly-cloudy-day-rain', night: 'partly-cloudy-night-rain' },
            82: { day: 'partly-cloudy-day-rain', night: 'partly-cloudy-night-rain' }, 85: { day: 'partly-cloudy-day-snow', night: 'partly-cloudy-night-snow' },
            86: { day: 'partly-cloudy-day-snow', night: 'partly-cloudy-night-snow' }, 95: 'thunderstorms', 96: 'thunderstorms-rain', 99: 'thunderstorms-rain'
        };

        function getIconUrl(code, isDay) {
            const iconInfo = weatherIconMap[code] || 'not-available';
            const iconName = typeof iconInfo === 'object' ? (isDay ? iconInfo.day : iconInfo.night) : iconInfo;
            return `data:image/svg+xml;base64,${btoa(bakedIcons[iconName] || bakedIcons['not-available'])}`;
        }
        
        const WEATHER_MAX_AGE = 30 * 60 * 1000; // after 30 min without a refresh, hide stale values

        function renderWeather(data) {
            document.getElementById('actual-temp').innerText = `${Math.round(data.current.temperature_2m)}°C`;
            document.getElementById('feels-temp').innerText = `/ ${Math.round(data.current.apparent_temperature)}°C`;
            document.getElementById('current-icon').src = getIconUrl(data.current.weather_code, data.current.is_day === 1);
            document.getElementById('current-icon').removeAttribute('title');

            const forecastContainer = document.getElementById('forecast');
            forecastContainer.innerHTML = '';
            const times = data.hourly.time;
            let nextHourIndex = times.findIndex(t => t > (Date.now() / 1000));
            if (nextHourIndex === -1) nextHourIndex = 0;

            for (let i = 0; i < 4; i++) {
                let idx = nextHourIndex + i;
                const hour = new Date(times[idx]*1000).getHours();
                const isDayForecast = hour > 6 && hour < 20;
                const item = document.createElement('div');
                item.className = 'forecast-item';
                item.innerHTML = `
                    <span class="forecast-time">${String(hour).padStart(2, '0')}:00</span>
                    <img src="${getIconUrl(data.hourly.weather_code[idx], isDayForecast)}" class="forecast-icon" alt="icon">
                    <span class="forecast-temp">${Math.round(data.hourly.temperature_2m[idx])}°</span>
                `;
                forecastContainer.appendChild(item);
            }
        }

        // Shown only when data is missing or older than WEATHER_MAX_AGE, so we never
        // display misleading stale values.
        function showWeatherUnavailable() {
            document.getElementById('actual-temp').innerText = '--°C';
            document.getElementById('feels-temp').innerText = 'unavailable';
            document.getElementById('current-icon').src = getIconUrl(null, true); // 'not-available' icon
            document.getElementById('forecast').innerHTML = '';
        }

        async function fetchWeather() {
            // Weather is fetched via a Cloudflare Worker proxy (Google-Trust-Services cert, trusted by
            // old iOS) because Open-Meteo's Let's Encrypt cert is no longer trusted by iPhone 6/7.
            const url = `https://odd-violet-21d8.adrianinfo.workers.dev/?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,weather_code,is_day&hourly=temperature_2m,weather_code&timeformat=unixtime&timezone=Europe%2FBerlin`;
            const MAX_ATTEMPTS = 3;

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (!data.current || typeof data.current.temperature_2m !== 'number') {
                        throw new Error(`bad payload: ${data.reason || 'missing current data'}`);
                    }
                    renderWeather(data);
                    lastWeatherSuccess = Date.now();
                    return;
                } catch (error) {
                    console.error(`Weather fetch attempt ${attempt}/${MAX_ATTEMPTS} failed:`, error);
                    // Leave the reason on the icon so it can be read on-device (long-press) if this recurs.
                    document.getElementById('current-icon').title = `weather error: ${error.message} @ ${new Date().toLocaleTimeString()}`;
                    if (attempt < MAX_ATTEMPTS) {
                        await new Promise(resolve => setTimeout(resolve, 3000));
                    }
                }
            }

            // Every attempt failed. If the last good data is recent (< 30 min) keep showing it;
            // otherwise hide it and show the unavailable indicator so it's not misleading.
            if (lastWeatherSuccess === 0 || (Date.now() - lastWeatherSuccess) > WEATHER_MAX_AGE) {
                showWeatherUnavailable();
            }
        }

        // --- INITIALIZATION ---
        window.onload = async () => {
            document.getElementById('ios-wakelock').play().catch(() => {});
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
                document.addEventListener('visibilitychange', async () => {
                    if (document.visibilityState === 'visible' && 'wakeLock' in navigator) {
                        try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
                    }
                });
            }
            
            // Refresh weather whenever the page returns to the foreground. Old iOS Safari
            // suspends timers while the phone sleeps, so the interval alone isn't enough.
            // This is separate from the wakeLock handler above, which never runs on iOS
            // versions without the Screen Wake Lock API (iPhone 6/7).
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') fetchWeather();
            });
            window.addEventListener('pageshow', () => fetchWeather());

            // Initial UI setup
            updateClockAndState();
            updateDate();
            fetchWeather();
            setupInteractions();
            setupBatteryMonitor();

            // Start Timers
            setInterval(updateClockAndState, 1000);
            setInterval(fetchWeather, 15 * 60 * 1000);
            setInterval(moveScreen, 60 * 1000);
            setInterval(updateDate, 5 * 60 * 1000); // Check date every 5 mins
        };
    </script>
