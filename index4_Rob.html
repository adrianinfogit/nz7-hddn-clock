<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Nightstand Clock+</title>
    <link rel="manifest" href="manifest-rob.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Clock+">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/000000/FFFFFF/?text=Clock%2B">
    
    <!-- Premium UI Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-primary: rgba(255, 255, 255, 0.95); 
            --text-secondary: rgba(255, 255, 255, 0.658); 
            --text-tertiary: rgba(255, 255, 255, 0.447); 
            --rain-color: #64a1c8; 
            --card-bg: rgba(255, 255, 255, 0.04); 
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden; user-select: none;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        
        body.is-dimmed {
            --text-primary: rgba(255, 255, 255, 0.55); 
            --text-secondary: rgba(255, 255, 255, 0.3); 
            --text-tertiary: rgba(255, 255, 255, 0.15); 
            --rain-color: rgba(100, 161, 200, 0.6);
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.03);
        }

        #app-container {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        #shift-container {
            width: 94vw; height: 94vh;
            display: flex; flex-direction: column;
            transition: transform 4s ease-in-out, opacity 1.5s ease-in-out; 
            box-sizing: border-box;
            opacity: 1; 
        }
        
        #date-display {
            font-size:6.2vh; font-weight: 300; color: var(--text-tertiary);
            text-align: center; letter-spacing: 0.15vw; text-transform: uppercase;
            padding-bottom: 1vh;
        }

        #clock-section {
            display: flex; justify-content: center; align-items: center; 
            width: 100%; flex: 1; 
        }
        #time {
            font-size: 55vh; font-weight: 300; line-height: 0.75; 
            letter-spacing: -0.9vw; font-variant-numeric: tabular-nums; 
            margin: 0; text-shadow: 0 2vh 4vh rgba(0,0,0,0.5);
        }

        /* --- WEATHER DASHBOARD --- */
        #weather-section {
            display: flex; justify-content: space-between; align-items: flex-end;
            width: 100%; padding-bottom: 2vh; gap: 2vw; 
        }

        #current-weather {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; flex: 0 0 auto; 
            cursor: pointer; -webkit-tap-highlight-color: transparent; 
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 3vh; padding: 2vh 3vw;
            backdrop-filter: blur(10px);
        }
        
        .current-top-row {
            display: flex; align-items: center; gap: 2vw; width: 100%; justify-content: center;
        }

        #current-icon {
            width: 14vh; height: 14vh; flex-shrink: 0; object-fit: contain; 
        }
        
        .temp-main {
            display: flex; align-items: baseline;
        }

        .temp-actual {
            font-size: 20vh; font-weight: 300; line-height: 0.85; letter-spacing: -0.6vw;
        }

        .temp-separator {
            font-size: 20vh; font-weight: 100; color: var(--text-tertiary); margin: 0 1vw;
        }

        .temp-feels {
            font-size: 18vh; font-weight: 300; color: var(--text-secondary); line-height: 0.85; letter-spacing: -0.4vw;
        }

        .temp-highlow-container {
            display: flex; justify-content: center; align-items: center; width: 100%;
        }

        .temp-highlow {
            font-size: 10vh; font-weight: 400; color: var(--text-tertiary); letter-spacing: 0.1vw;
        }

        #forecast {
            display: flex; flex: 1; justify-content: space-between; align-items: flex-end; gap: 1.5vw;
        }
        .forecast-item {
            display: flex; flex-direction: column; align-items: center; gap: 1vh;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 3vh; padding: 1.5vh 1.5vw; flex: 1; 
            backdrop-filter: blur(10px); 
        }
        .forecast-time {
            font-size: 3.8vh; color: var(--text-tertiary); font-weight: 500; 
            letter-spacing: 0.05vw; text-transform: uppercase;
        }
        .forecast-icon {
            width: 9vh; height: 9vh; flex-shrink: 0; object-fit: contain; margin: 0.5vh 0;
        }
        .forecast-precip-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 5.5vh; opacity: 1; transition: opacity 0.3s ease;
        }
        .forecast-precip-container.hidden { opacity: 0; }
        .forecast-rain-row { display: flex; align-items: center; gap: 0.4vw; }
        .rain-drop-icon { width: 2.2vh; height: 2.2vh; color: var(--rain-color); }
        .forecast-rain { font-size: 3vh; font-weight: 500; color: var(--rain-color); line-height: 1; }
        .forecast-amount { font-size: 2.6vh; font-weight: 400; color: var(--text-secondary); line-height: 1; margin-top: 0.3vh; }
        .forecast-temp { font-size: 8vh; font-weight: 400; color: var(--text-primary); margin-top: 0.5vh; }

        /* --- Overlays --- */
        #ios-wakelock { display: none; }
        #battery-warning {
            position: fixed; top: 3vh; right: 3vw; width: 4vh; height: 4vh; color: #ff3b30;
            display: none; animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ===============================
           PORTRAIT MODE OVERRIDES
           =============================== */
        @media (orientation: portrait) {
            #shift-container { justify-content: center; }
            #date-display { font-size: 8vw; letter-spacing: 0.2vw; padding: 0; }
            #clock-section { flex: 0 0 auto; margin: 2vh 0; } 
            #time { font-size: 35vw; }

            /* Stack weather sections vertically */
            #weather-section { flex-direction: column; align-items: center; gap: 3vh; padding: 0; }
            
            #current-weather { flex: 0 0 auto; width: 90%; box-sizing: border-box; padding: 3vw; gap: 1.5vw; }
            .current-top-row { gap: 3vw; }
            #current-icon { width: 16vw; height: 16vw; }
            
            .temp-actual { font-size: 20vw; letter-spacing: -0.5vw; }
            .temp-separator { font-size: 10vw; margin: 0 1.5vw; }
            .temp-feels { font-size: 14vw; letter-spacing: -0.3vw; }
            
            .temp-highlow-container { margin-top: 1vw; }
            .temp-highlow { font-size: 5vw; }

            /* Make forecast a 2x2 grid */
            #forecast { width: 90%; flex-wrap: wrap; justify-content: center; }
            .forecast-item { flex-basis: 46%; padding: 2vw; }
            .forecast-time { font-size: 4vw; }
            .forecast-icon { width: 12vw; height: 12vw; margin: 1vw 0; }
            .forecast-precip-container { min-height: 6.5vw; }
            .rain-drop-icon { width: 3vw; height: 3vw; }
            .forecast-rain { font-size: 3.5vw; }
            .forecast-amount { font-size: 3vw; }
            .forecast-temp { font-size: 8vw; margin-top: 1vw; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="shift-container">
            <div id="date-display">--</div>
            
            <div id="clock-section">
                <div id="time">00:00</div>
            </div>

            <div id="weather-section">
                <div id="current-weather">
                    <div class="current-top-row">
                        <img id="current-icon" src="" alt="Weather Icon">
                        <div class="temp-main">
                            <span class="temp-actual" id="actual-temp">--°</span>
                            <span class="temp-separator">/</span>
                            <span class="temp-feels" id="feels-temp">--°</span>
                        </div>
                    </div>
                    <div class="temp-highlow-container">
                        <span class="temp-highlow" id="highlow-temp">H:--° L:--°</span>
                    </div>
                </div>
                <div id="forecast"><!-- Injected via JS --></div>
            </div>
        </div>
    </div>

    <script>
        // Service worker removed: on old iOS Safari its all-or-nothing cache made updates
        // fail and the phone kept serving a stale page. Proactively unregister any worker
        // previously installed on a device, and clear its caches, so pages always load fresh.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
            if (window.caches) caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
        }
        
        const LAT = 50.10, LON = 8.54; // rounded to ~1 km so a public URL doesn't pinpoint home
        let wakeLock = null; let isManualSleep = false; let peekTimeout = null;
        let lastWeatherSuccess = 0; // timestamp of the last successful weather fetch (0 = never)

        function updateClockAndState() {
            const now = new Date();
            const hours = now.getHours(); const minutes = now.getMinutes(); const seconds = now.getSeconds();

            document.getElementById('time').innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            if (hours === 3 && minutes === 0 && seconds === 0) window.location.reload();

            const isAutoSleepTime = (hours === 22 && minutes >= 5) || hours > 22 || hours < 6;
            const isDimTime = hours >= 20 && !isAutoSleepTime;
            const shouldBeAsleep = isManualSleep || isAutoSleepTime;

            const shiftContainer = document.getElementById('shift-container');
            const weatherSection = document.getElementById('weather-section');
            const dateDisplay = document.getElementById('date-display');
            const timeEl = document.getElementById('time');
            if (shouldBeAsleep) {
                shiftContainer.style.opacity = '1';
                timeEl.style.color = 'rgba(240,240,240,0.7)';
                timeEl.style.textShadow = 'none';
                if (weatherSection) weatherSection.style.opacity = '0';
                if (dateDisplay) dateDisplay.style.opacity = '0';
            } else {
                shiftContainer.style.opacity = '1';
                timeEl.style.color = '';
                timeEl.style.textShadow = '';
                if (weatherSection) weatherSection.style.opacity = '1';
                if (dateDisplay) dateDisplay.style.opacity = '1';
            }
            
            document.body.classList.toggle('is-dimmed', isDimTime && !shouldBeAsleep);
        }

        function updateDate() {
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', options);
        }

        function moveScreen() {
            const container = document.getElementById('shift-container');
            container.style.transform = `translate(${Math.floor(Math.random()*15)-7}px, ${Math.floor(Math.random()*15)-7}px)`;
        }

        function setupInteractions() {
            document.body.addEventListener('dblclick', () => { isManualSleep = !isManualSleep; updateClockAndState(); });
            document.body.addEventListener('click', () => {
                const isAutoSleepTime = new Date().getHours() >= 22 || new Date().getHours() < 6;
                if (isManualSleep || isAutoSleepTime) {
                    clearTimeout(peekTimeout);
                    const timeEl = document.getElementById('time');
                    timeEl.style.color = '';
                    timeEl.style.textShadow = '';
                    document.getElementById('weather-section').style.opacity = '1';
                    document.getElementById('date-display').style.opacity = '1';
                    peekTimeout = setTimeout(() => { updateClockAndState(); }, 5000);
                }
            });
            document.getElementById('current-weather').addEventListener('click', (e) => {
                const isAutoSleepTime = new Date().getHours() >= 22 || new Date().getHours() < 6;
                if (!isManualSleep && !isAutoSleepTime) {
                    e.stopPropagation(); window.location.href = 'https://www.wetteronline.de/wetter/frankfurt-am-main/hoechst';
                }
            });
        }
        
        function setupBatteryMonitor() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(b => {
                    const check = () => { document.getElementById('battery-warning').style.display = (!b.charging && b.level < 0.2) ? 'block' : 'none'; };
                    check(); b.addEventListener('chargingchange', check); b.addEventListener('levelchange', check);
                });
            }
        }

        };

        const weatherIconMap = {
            0: { day: 'clear-day', night: 'clear-night' }, 1: { day: 'partly-cloudy-day', night: 'partly-cloudy-night' },
            2: { day: 'partly-cloudy-day', night: 'partly-cloudy-night' }, 3: 'overcast', 45: 'fog', 48: 'fog',
            51: 'drizzle', 53: 'drizzle', 55: 'drizzle', 56: 'sleet', 57: 'sleet', 61: 'rain', 63: 'rain', 65: 'rain',
            66: 'sleet', 67: 'sleet', 71: 'snow', 73: 'snow', 75: 'snow', 77: 'snow',
            80: { day: 'partly-cloudy-day-rain', night: 'partly-cloudy-night-rain' }, 81: { day: 'partly-cloudy-day-rain', night: 'partly-cloudy-night-rain' },
            82: { day: 'partly-cloudy-day-rain', night: 'partly-cloudy-night-rain' }, 85: { day: 'partly-cloudy-day-snow', night: 'partly-cloudy-night-snow' },
            86: { day: 'partly-cloudy-day-snow', night: 'partly-cloudy-night-snow' }, 95: 'thunderstorms', 96: 'thunderstorms-rain', 99: 'thunderstorms-rain'
        };

        function getIconUrl(code, isDay) {
            const iconInfo = weatherIconMap[code] || 'not-available';
            const iconName = typeof iconInfo === 'object' ? (isDay ? iconInfo.day : iconInfo.night) : iconInfo;
            return `data:image/svg+xml;base64,${btoa(bakedIcons[iconName] || bakedIcons['not-available'])}`;
        }
        
        const WEATHER_MAX_AGE = 30 * 60 * 1000; // after 30 min without a refresh, hide stale values

        function renderWeather(data) {
            document.getElementById('actual-temp').innerText = `${Math.round(data.current.temperature_2m)}°`;
            document.getElementById('feels-temp').innerText = `${Math.round(data.current.apparent_temperature)}°`;
            const icon = document.getElementById('current-icon');
            icon.src = getIconUrl(data.current.weather_code, data.current.is_day === 1);
            icon.removeAttribute('title');

            const high = Math.round(data.daily.temperature_2m_max[0]);
            const low = Math.round(data.daily.temperature_2m_min[0]);
            document.getElementById('highlow-temp').innerText = `H:${high}° L:${low}°`;

            const forecastContainer = document.getElementById('forecast');
            forecastContainer.innerHTML = '';
            const times = data.hourly.time;
            let nextHourIndex = times.findIndex(t => t > (Date.now() / 1000));
            if (nextHourIndex === -1) nextHourIndex = 0;

            for (let i = 0; i < 4; i++) {
                let idx = nextHourIndex + i;

                const probability = data.hourly.precipitation_probability[idx] || 0;
                const amount = data.hourly.precipitation[idx] || 0;

                let precipHtml = '';

                if (probability >= 10 || amount >= 0.1) {
                    precipHtml = `
                        <div class="forecast-precip-container">
                            <div class="forecast-rain-row">
                                <svg class="rain-drop-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M232,120a88,88,0,0,1-176,0c0-42.57,36.52-87.31,64-113.82a32,32,0,0,1,44,0C191.48,32.69,232,77.43,232,120Zm-16,0c0-36.4-36.21-78.18-62.63-103.58a16,16,0,0,0-22.74,0C104.21,41.82,68,83.6,68,120a72,72,0,0,0,144,0Z"></path></svg>
                                <span class="forecast-rain">${Math.round(probability)}%</span>
                            </div>
                            <span class="forecast-amount">${amount > 0 ? amount.toFixed(1) + ' mm' : '< 0.1 mm'}</span>
                        </div>
                    `;
                } else {
                    precipHtml = `<div class="forecast-precip-container hidden"></div>`;
                }

                const hour = new Date(times[idx] * 1000).getHours();
                const isDayForecast = hour > 6 && hour < 20;
                const iconUrl = getIconUrl(data.hourly.weather_code[idx], isDayForecast);

                const item = document.createElement('div');
                item.className = 'forecast-item';

                item.innerHTML = `
                    <span class="forecast-time">${String(hour).padStart(2, '0')}:00</span>
                    <img src="${iconUrl}" class="forecast-icon" alt="icon">
                    ${precipHtml}
                    <span class="forecast-temp">${Math.round(data.hourly.temperature_2m[idx])}°</span>
                `;
                forecastContainer.appendChild(item);
            }
        }

        // Shown only when data is missing or older than WEATHER_MAX_AGE, so we never
        // display misleading stale values.
        function showWeatherUnavailable() {
            document.getElementById('actual-temp').innerText = '--°';
            document.getElementById('feels-temp').innerText = '--°';
            document.getElementById('current-icon').src = getIconUrl(null, true); // 'not-available' icon
            document.getElementById('highlow-temp').innerText = 'unavailable';
            document.getElementById('forecast').innerHTML = '';
        }

        async function fetchWeather() {
            // Weather is fetched via a Cloudflare Worker proxy (Google-Trust-Services cert, trusted by
            // old iOS) because Open-Meteo's Let's Encrypt cert is no longer trusted by iPhone 6/7.
            const url = `https://odd-violet-21d8.adrianinfo.workers.dev/?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,weather_code,is_day&hourly=temperature_2m,weather_code,precipitation_probability,precipitation&daily=temperature_2m_max,temperature_2m_min&timeformat=unixtime&timezone=Europe%2FBerlin&models=icon_seamless`;
            const MAX_ATTEMPTS = 3;

            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (!data.current || typeof data.current.temperature_2m !== 'number' || !data.daily || !data.hourly) {
                        throw new Error(`bad payload: ${data.reason || 'missing data'}`);
                    }
                    renderWeather(data);
                    lastWeatherSuccess = Date.now();
                    return;
                } catch (error) {
                    console.error(`Weather fetch attempt ${attempt}/${MAX_ATTEMPTS} failed:`, error);
                    // Leave the reason on the icon so it can be read on-device (long-press) if this recurs.
                    document.getElementById('current-icon').title = `weather error: ${error.message} @ ${new Date().toLocaleTimeString()}`;
                    if (attempt < MAX_ATTEMPTS) {
                        await new Promise(resolve => setTimeout(resolve, 3000));
                    }
                }
            }

            // Every attempt failed. If the last good data is recent (< 30 min) keep showing it;
            // otherwise hide it and show the unavailable indicator so it's not misleading.
            if (lastWeatherSuccess === 0 || (Date.now() - lastWeatherSuccess) > WEATHER_MAX_AGE) {
                showWeatherUnavailable();
            }
        }

        window.onload = async () => {
            document.getElementById('ios-wakelock').play().catch(() => {});
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
                document.addEventListener('visibilitychange', async () => {
                    if (document.visibilityState === 'visible' && 'wakeLock' in navigator) {
                        try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
                    }
                });
            }
            // Refresh weather whenever the page returns to the foreground. Old iOS Safari
            // suspends timers while the phone sleeps, so the interval alone isn't enough.
            // Separate from the wakeLock handler above, which never runs on iOS versions
            // without the Screen Wake Lock API (iPhone 6/7).
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') fetchWeather();
            });
            window.addEventListener('pageshow', () => fetchWeather());

            updateClockAndState(); updateDate(); fetchWeather(); setupInteractions(); setupBatteryMonitor();
            setInterval(updateClockAndState, 1000); setInterval(fetchWeather, 15 * 60 * 1000);
            setInterval(moveScreen, 60 * 1000); setInterval(updateDate, 5 * 60 * 1000);
        };
    </script>
